<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tesla Drive Hub</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="description" content="Dashboard optimizado para Tesla Model Y - Simula Android Auto y Apple CarPlay">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tesla Hub">
    
    <!-- Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000'/><path d='M50 20 L80 50 L50 80 L20 50 Z' fill='%2300ffff'/></svg>">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <!-- Header con hora y estado -->
        <header class="dashboard-header">
            <div class="status-bar">
                <div class="time-display">
                    <span id="currentTime">--:--</span>
                    <span class="date-small" id="currentDate">---</span>
                </div>
                <div class="status-indicators">
                    <div class="indicator">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
                            <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
                            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                            <circle cx="12" cy="20" r="1"></circle>
                        </svg>
                    </div>
                    <div class="indicator">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="1" y="6" width="18" height="11" rx="2" ry="2"></rect>
                            <line x1="22" y1="9" x2="22" y2="13"></line>
                        </svg>
                        <span class="battery-level">87%</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Layout estilo CarPlay -->
        <main class="dashboard-grid carplay-layout">
            <aside class="app-sidebar" aria-label="Apps principales">
                <button class="sidebar-app active" data-target="navigation" data-app="navigation">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
                    </svg>
                    <span>Nav</span>
                </button>
                <button class="sidebar-app" data-target="media" data-app="media">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2v20M2 12h20" opacity="0"></path>
                        <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"></circle>
                        <circle cx="12" cy="12" r="4"></circle>
                    </svg>
                    <span>Music</span>
                </button>
                <button class="sidebar-app" data-target="telegram" data-app="telegram">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M21.05 2.01L2.95 9c-1.23.5-1.22 1.2-.22 1.51l4.64 1.45 1.79 5.39c.22.6.11.83.74.83.49 0 .71-.22.99-.49l2.23-2.17 4.64 3.43c.86.47 1.47.23 1.68-.8l3.08-14.5c.31-1.27-.49-1.85-1.47-1.4z"/>
                    </svg>
                    <span>Chat</span>
                </button>
                <button class="sidebar-app" data-target="whatsapp" data-app="whatsapp">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0012.04 2z"/>
                    </svg>
                    <span>WA</span>
                </button>
                <button class="sidebar-app" data-target="weather" data-app="weather">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
                    </svg>
                    <span>Clima</span>
                </button>
                <button class="sidebar-app" data-target="shortcuts" data-app="shortcuts">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <span>Apps</span>
                </button>
            </aside>

            <section class="content-panel">
                <div class="content-grid">
                    <!-- Navegación - Área grande -->
                    <section class="grid-item navigation-hub" data-app="navigation">
                        <div class="card-glow"></div>
                        <div class="card-content">
                            <div class="card-header">
                                <svg class="card-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
                                </svg>
                                <h2>Navegación</h2>
                            </div>
                            <div class="nav-options">
                                <button class="nav-btn primary" onclick="openApp('https://waze.com/live-map')">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                                    </svg>
                                    <span>Waze</span>
                                </button>
                                <button class="nav-btn primary" onclick="openApp('https://www.google.com/maps')">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
                                    </svg>
                                    <span>Google Maps</span>
                                </button>
                            </div>
                            <div class="boardinggate-section">
                                <div class="bg-label">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                        <circle cx="12" cy="10" r="3"></circle>
                                    </svg>
                                    <span>Tesla Navigator Avanzado</span>
                                </div>
                                <div class="bg-buttons">
                                    <button class="nav-btn boardinggate original" onclick="openApp('https://boardinggate.github.io/Tesla/tesla.html')">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                                            <polyline points="15 3 21 3 21 9"></polyline>
                                            <line x1="10" y1="14" x2="21" y2="3"></line>
                                        </svg>
                                        <span>BoardingGate Original</span>
                                    </button>
                                    <button class="nav-btn boardinggate local" onclick="openLocalNavigator()">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M3 3h18v18H3z"></path>
                                            <path d="M8 12l3 3 5-5"></path>
                                        </svg>
                                        <span>Navegador Local</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Spotify -->
                    <section class="grid-item media-hub" data-app="media">
                        <div class="card-glow"></div>
                        <div class="card-content">
                            <div class="card-header">
                                <svg class="card-icon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <path d="M8 10.5c2.5-1 5.5-.9 8 .3M8.5 13.5c2-0.6 4.3-0.5 6.3.4M9.2 16c1.5-.4 3-.3 4.2.4" stroke="#111" stroke-width="1.6" stroke-linecap="round" fill="none"></path>
                                </svg>
                                <h2>Spotify</h2>
                            </div>
                            <div class="media-display">
                                <div class="now-playing">
                                    <div class="album-art">
                                        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <circle cx="12" cy="12" r="10"></circle>
                                            <circle cx="12" cy="12" r="3"></circle>
                                        </svg>
                                    </div>
                                    <div class="track-info">
                                        <p class="track-title">Conduce con ritmo</p>
                                        <p class="track-artist">Inicia tu playlist favorita</p>
                                    </div>
                                </div>
                            </div>
                            <div class="media-controls">
                                <button class="control-btn" onclick="openApp('https://open.spotify.com')">
                                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </section>

                    <!-- Telegram -->
                    <section class="grid-item messaging-hub telegram" data-app="telegram">
                        <div class="card-glow"></div>
                        <div class="card-content">
                            <div class="card-header">
                                <svg class="card-icon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M21.5 2.5L2.8 10.1c-1.2.5-1.2 1.2-.2 1.5l4.8 1.5 1.8 5.6c.2.6.1.8.7.8.5 0 .7-.2 1-.5l2.4-2.3 5 3.7c.9.5 1.5.2 1.7-.8l3.2-15c.3-1.3-.5-1.9-1.5-1.4z"></path>
                                </svg>
                                <h2>Telegram</h2>
                            </div>
                            <button class="app-launch-btn" onclick="openApp('https://web.telegram.org')">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                                </svg>
                                <span>Abrir mensajes</span>
                            </button>
                            <div class="quick-info"><div class="info-badge"><span>Mensajería segura</span></div></div>
                        </div>
                    </section>

                    <!-- WhatsApp -->
                    <section class="grid-item messaging-hub whatsapp" data-app="whatsapp">
                        <div class="card-glow"></div>
                        <div class="card-content">
                            <div class="card-header">
                                <svg class="card-icon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0012.04 2z"/>
                                </svg>
                                <h2>WhatsApp</h2>
                            </div>
                            <button class="app-launch-btn" onclick="openApp('https://web.whatsapp.com')">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                                </svg>
                                <span>Abrir chats</span>
                            </button>
                            <div class="quick-info"><div class="info-badge"><span>Mensajes instantáneos</span></div></div>
                        </div>
                    </section>

                    <!-- Clima -->
                    <section class="grid-item weather-widget" data-app="weather">
                        <div class="card-glow"></div>
                        <div class="card-content">
                            <div class="card-header">
                                <svg class="card-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
                                </svg>
                                <h2>Clima</h2>
                            </div>
                            <div class="weather-display">
                                <div class="temp-main"><span class="temp-value" id="temperature">--°</span></div>
                                <div class="weather-details">
                                    <p class="weather-condition" id="condition">Cargando...</p>
                                    <p class="weather-location" id="location">---</p>
                                </div>
                            </div>
                            <button class="weather-refresh" onclick="loadWeather()">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="23 4 23 10 17 10"></polyline>
                                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                                </svg>
                            </button>
                        </div>
                    </section>

                    <!-- Accesos rápidos -->
                    <section class="grid-item quick-access" data-app="shortcuts">
                        <div class="card-glow"></div>
                        <div class="card-content">
                            <div class="card-header">
                                <svg class="card-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="3" width="7" height="7"></rect>
                                    <rect x="14" y="3" width="7" height="7"></rect>
                                    <rect x="14" y="14" width="7" height="7"></rect>
                                    <rect x="3" y="14" width="7" height="7"></rect>
                                </svg>
                                <h2>Accesos</h2>
                            </div>
                            <div class="shortcuts-grid">
                                <button class="shortcut-btn" onclick="openApp('https://www.google.com')"><span>Navegar</span></button>
                                <button class="shortcut-btn" onclick="openApp('https://www.youtube.com')"><span>YouTube</span></button>
                                <button class="shortcut-btn" onclick="openApp('https://calendar.google.com')"><span>Agenda</span></button>
                                <button class="shortcut-btn" onclick="toggleFullscreen()"><span>Pantalla</span></button>
                            </div>
                        </div>
                    </section>
                </div>
            </section>
        </main>

        <!-- Modal para apps fullscreen (legacy - puede eliminarse) -->
        <div id="appModal" class="app-modal" style="display: none;">
            <div class="modal-header">
                <button class="back-btn" onclick="closeApp()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span>Volver al Dashboard</span>
                </button>
            </div>
            <iframe id="appFrame" src="" frameborder="0" allow="autoplay; encrypted-media; fullscreen" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals"></iframe>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
